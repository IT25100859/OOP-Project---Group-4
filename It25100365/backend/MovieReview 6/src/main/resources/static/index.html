<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .movie-item {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: background 0.2s;
        }

        .movie-item:hover {
            background: #e9ecef;
        }

        .movie-item h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .movie-item p {
            color: #666;
            font-size: 14px;
        }

        .rating {
            color: #ffc107;
            font-size: 18px;
        }

        .review-item {
            background: #f8f9fa;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
        }

        .review-item .reviewer {
            font-weight: bold;
            color: #333;
        }

        .review-item .stars {
            color: #ffc107;
        }

        .review-item .comment {
            color: #666;
            margin-top: 5px;
        }

        .section {
            margin-top: 20px;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .delete-btn {
            background: #dc3545;
            margin-top: 5px;
        }

        .edit-btn {
            background: #ffc107;
            color: #333;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎬 Movie Review Application</h1>
        <p>Create movies and share your reviews</p>
    </div>

    <div class="grid">
        <!-- Create Movie Card -->
        <div class="card">
            <h2>➕ Create New Movie</h2>
            <div id="messageBox" class="message"></div>
            <input type="text" id="movieTitle" placeholder="Movie Title *" required>
            <input type="text" id="movieGenre" placeholder="Genre (e.g., Action, Drama, Sci-Fi)">
            <input type="text" id="movieDirector" placeholder="Director Name">
            <input type="number" id="movieYear" placeholder="Release Year (e.g., 2024)" min="1900" max="2026">
            <textarea id="movieDesc" placeholder="Movie Description"></textarea>
            <button onclick="createMovie()">🎥 Create Movie</button>
        </div>

        <!-- Create Review Card -->
        <div class="card">
            <h2>⭐ Write a Review</h2>
            <select id="reviewMovieId">
                <option value="">Select a Movie...</option>
            </select>
            <input type="text" id="reviewerName" placeholder="Your Name *" required>
            <select id="reviewRating">
                <option value="5">⭐⭐⭐⭐⭐ (5 Stars)</option>
                <option value="4">⭐⭐⭐⭐ (4 Stars)</option>
                <option value="3">⭐⭐⭐ (3 Stars)</option>
                <option value="2">⭐⭐ (2 Stars)</option>
                <option value="1">⭐ (1 Star)</option>
            </select>
            <textarea id="reviewComment" placeholder="Your review comment..."></textarea>
            <button onclick="createReview()">📝 Submit Review</button>
        </div>
    </div>

    <!-- Movies List -->
    <div class="card section">
        <h2>🎬 All Movies</h2>
        <button onclick="loadAllMovies()">🔄 Refresh Movies</button>
        <div id="moviesContainer"></div>
    </div>

    <!-- Reviews Section -->
    <div class="card section" id="reviewsSection" style="display: none;">
        <h2>📝 Reviews for <span id="selectedMovieTitle"></span></h2>
        <button class="delete-btn" onclick="closeReviews()">✕ Close</button>
        <div id="reviewsContainer"></div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api';

    // Show message
    function showMessage(text, type) {
        const msgBox = document.getElementById('messageBox');
        msgBox.textContent = text;
        msgBox.className = 'message ' + type;
        msgBox.style.display = 'block';
        setTimeout(() => {
            msgBox.style.display = 'none';
        }, 3000);
    }

    // Create Movie
    async function createMovie() {
        const title = document.getElementById('movieTitle').value.trim();
        const genre = document.getElementById('movieGenre').value.trim();
        const director = document.getElementById('movieDirector').value.trim();
        const releaseYear = document.getElementById('movieYear').value;
        const description = document.getElementById('movieDesc').value.trim();

        if (!title) {
            showMessage('Please enter a movie title!', 'error');
            return;
        }

        const movie = {
            title: title,
            genre: genre || null,
            director: director || null,
            releaseYear: releaseYear ? parseInt(releaseYear) : null,
            description: description || null
        };

        try {
            const response = await fetch(`${API_URL}/movies`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movie)
            });

            if (response.ok) {
                const data = await response.json();
                showMessage(`✅ Movie "${data.title}" created successfully!`, 'success');
                clearMovieForm();
                loadAllMovies();
                loadMovieDropdown();
            } else {
                showMessage('❌ Failed to create movie!', 'error');
            }
        } catch (error) {
            showMessage('❌ Error: ' + error.message, 'error');
        }
    }

    // Create Review
    async function createReview() {
        const movieId = document.getElementById('reviewMovieId').value;
        const reviewerName = document.getElementById('reviewerName').value.trim();
        const rating = parseInt(document.getElementById('reviewRating').value);
        const comment = document.getElementById('reviewComment').value.trim();

        if (!movieId) {
            showMessage('Please select a movie!', 'error');
            return;
        }

        if (!reviewerName) {
            showMessage('Please enter your name!', 'error');
            return;
        }

        const review = {
            reviewerName: reviewerName,
            rating: rating,
            comment: comment || null
        };

        try {
            const response = await fetch(`${API_URL}/reviews/movie/${movieId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(review)
            });

            if (response.ok) {
                const data = await response.json();
                showMessage(`✅ Review submitted! Rating: ${'⭐'.repeat(data.rating)}`, 'success');
                clearReviewForm();
                loadAllMovies();
            } else {
                showMessage('❌ Failed to submit review!', 'error');
            }
        } catch (error) {
            showMessage('❌ Error: ' + error.message, 'error');
        }
    }

    // Load All Movies
    async function loadAllMovies() {
        try {
            const response = await fetch(`${API_URL}/movies`);
            const movies = await response.json();
            displayMovies(movies);
        } catch (error) {
            console.error('Error loading movies:', error);
        }
    }

    // Display Movies
    function displayMovies(movies) {
        const container = document.getElementById('moviesContainer');

        if (movies.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No movies yet. Create one!</p>';
            return;
        }

        container.innerHTML = movies.map(movie => `
                <div class="movie-item" onclick="viewReviews(${movie.id}, '${movie.title.replace(/'/g, "\\'")}')">
                    <h3>${movie.title} ${movie.releaseYear ? `(${movie.releaseYear})` : ''}</h3>
                    <p>${movie.genre ? movie.genre : ''} ${movie.director ? '| Director: ' + movie.director : ''}</p>
                    <p>${movie.description ? movie.description.substring(0, 100) + '...' : ''}</p>
                    <p class="rating">${getStars(movie.averageRating)} ${movie.averageRating ? movie.averageRating.toFixed(1) : 'No ratings yet'}</p>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteMovie(${movie.id})">🗑️ Delete</button>
                </div>
            `).join('');
    }

    // View Reviews for a Movie
    async function viewReviews(movieId, movieTitle) {
        document.getElementById('selectedMovieTitle').textContent = movieTitle;
        document.getElementById('reviewsSection').style.display = 'block';

        try {
            const response = await fetch(`${API_URL}/movies/${movieId}`);
            const movie = await response.json();
            displayReviews(movie.reviews);
        } catch (error) {
            console.error('Error loading reviews:', error);
        }

        document.getElementById('reviewsSection').scrollIntoView({ behavior: 'smooth' });
    }

    // Display Reviews
    function displayReviews(reviews) {
        const container = document.getElementById('reviewsContainer');

        if (!reviews || reviews.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No reviews yet. Be the first to review!</p>';
            return;
        }

        container.innerHTML = reviews.map(review => `
                <div class="review-item">
                    <div class="reviewer">${review.reviewerName}</div>
                    <div class="stars">${'⭐'.repeat(review.rating)}</div>
                    <div class="comment">${review.comment || 'No comment'}</div>
                    <small style="color: #999;">${new Date(review.createdAt).toLocaleDateString()}</small>
                    <br>
                    <button class="delete-btn" onclick="deleteReview(${review.id})">🗑️ Delete</button>
                </div>
            `).join('');
    }

    // Delete Movie
    async function deleteMovie(movieId) {
        if (!confirm('Are you sure you want to delete this movie and all its reviews?')) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/movies/${movieId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showMessage('✅ Movie deleted successfully!', 'success');
                loadAllMovies();
                loadMovieDropdown();
                closeReviews();
            }
        } catch (error) {
            showMessage('❌ Error deleting movie!', 'error');
        }
    }

    // Delete Review
    async function deleteReview(reviewId) {
        if (!confirm('Delete this review?')) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/reviews/${reviewId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showMessage('✅ Review deleted!', 'success');
                loadAllMovies();
                const movieTitle = document.getElementById('selectedMovieTitle').textContent;
                const movieId = document.getElementById('reviewMovieId').value;
                if (movieId) {
                    viewReviews(movieId, movieTitle);
                }
            }
        } catch (error) {
            showMessage('❌ Error deleting review!', 'error');
        }
    }

    // Load Movie Dropdown
    async function loadMovieDropdown() {
        try {
            const response = await fetch(`${API_URL}/movies`);
            const movies = await response.json();
            const dropdown = document.getElementById('reviewMovieId');

            dropdown.innerHTML = '<option value="">Select a Movie...</option>' +
                movies.map(movie =>
                    `<option value="${movie.id}">${movie.title} (${movie.releaseYear || 'N/A'})</option>`
                ).join('');
        } catch (error) {
            console.error('Error loading movie dropdown:', error);
        }
    }

    // Close Reviews
    function closeReviews() {
        document.getElementById('reviewsSection').style.display = 'none';
    }

    // Clear Forms
    function clearMovieForm() {
        document.getElementById('movieTitle').value = '';
        document.getElementById('movieGenre').value = '';
        document.getElementById('movieDirector').value = '';
        document.getElementById('movieYear').value = '';
        document.getElementById('movieDesc').value = '';
    }

    function clearReviewForm() {
        document.getElementById('reviewerName').value = '';
        document.getElementById('reviewComment').value = '';
        document.getElementById('reviewRating').value = '5';
    }

    // Get Star Display
    function getStars(rating) {
        if (!rating || rating === 0) return '';
        const fullStars = Math.floor(rating);
        return '⭐'.repeat(fullStars);
    }

    // Load data when page loads
    window.onload = function() {
        loadAllMovies();
        loadMovieDropdown();
    };
</script>
</body>
</html>
